# MCP Gateway — development configuration
# Maps to MCP-Secure-Architecture-v10-Final-BuildSpec.md (§4.4).
# PRODUCTION SWAP POINTS are marked; nothing else changes when they are swapped.

llm:
  # "mock" needs no GPU. When GPUs arrive: provider: openai_compat + base_url of vLLM.
  provider: mock                 # mock | openai_compat
  base_url: "http://localhost:8000/v1"   # vLLM OpenAI-compatible endpoint (unused in mock mode)
  model: "qwen3.5"               # model name at the serving layer (unused in mock mode)

auth:
  # TPM-bound certificate authentication (redesign plan §1-3). No shared secret,
  # no passwords. Session tokens are ES256-signed and bound to the client cert.
  # PRODUCTION SWAP POINTS: signing key -> OpenBao Transit/HSM; IdP -> Keycloak +
  # AD/LDAP X.509 CBA; thumbprint header -> injected by the mTLS-terminating sidecar.
  mode: "builtin"                            # builtin (TPM+PIN, dev) | oidc (external Keycloak)
  issuer: "https://gateway.internal/idp"    # token issuer identity
  audience: "mcp-gateway"                    # tokens are scoped to this gateway
  alg: "ES256"                               # ECDSA P-256 (not EdDSA; NCA NCS-1:2020)
  # Production auth: point at a self-hosted Keycloak realm; the gateway becomes a
  # Resource Server validating its JWTs (no token minting). Set mode: oidc.
  oidc:
    jwks_url: "https://keycloak.internal/realms/gov/protocol/openid-connect/certs"
    issuer: "https://keycloak.internal/realms/gov"
    audience: "mcp-gateway"
    algorithms: ["RS256", "ES256"]
    role_claim: "role"
    clearance_claim: "clearance"
    name_claim: "name"
  access_ttl_seconds: 600                    # short-lived session token (10 min)
  challenge_ttl_seconds: 120                 # login challenge validity
  clock_skew_seconds: 30
  aal: "aal2"                                # assurance level asserted in the token acr
  lockout_threshold: 5                       # failed logins before lockout (TPM anti-hammering)
  lockout_seconds: 60                        # short cooldown so a lockout-DoS self-heals fast (M1)
  step_up_max_age_seconds: 300               # Tier-3 approval needs auth this fresh
  login_rate_per_minute: 120                 # per-IP throttle on auth endpoints (M1/M5); tighten in prod
  max_request_bytes: 65536                   # reject oversized request bodies (M3)
  pki_dir: "pki"                             # dev CA + signing key + PIN-sealed user certs
  dev_login_enabled: true                    # DEV ONLY: /api/dev/login (still requires the PIN)
  # Origin allow-list for the DNS-rebinding defense (MCP spec MUST). Real default
  # (not "*") so the guard is active; add your gateway origins in production.
  allowed_origins: ["http://127.0.0.1:8800", "http://localhost:8800"]

gateway:
  host: "127.0.0.1"
  port: 8800
  max_tool_result_bytes: 262144        # protocol hardening: size limit on tool results
  max_arg_string_len: 20000            # size limit on any single tool argument
  rate_limit_calls_per_minute: 30      # per-user tool-call budget
  rate_limit_per_tool_per_minute: 10   # per-(user,tool) budget (tight on costly/destructive ops)
  rate_limit_per_server_per_minute: 60 # per-server budget (contain one compromised server)
  taint_min_len: 12                    # min substring length considered for taint matching
  breaker_failure_threshold: 5         # consecutive server failures before the circuit opens
  breaker_cooldown_seconds: 30         # how long a tripped server stays quarantined

# Per-backend dynamic credentials injected at dispatch (never in model context).
# PRODUCTION SWAP POINT: OpenBao dynamic DB credentials via hvac; keys in HSM.
vault:
  actions:                             # the write-action server gets per-call creds
    ttl_seconds: 300

# Audit / SIEM. PRODUCTION SWAP POINT: point the SIEM stream at Wazuh/OpenSearch.
audit:
  siem_export: true                    # mirror every audit event to the SIEM feed
  siem_stream: "siem_stream.jsonl"

# Tool onboarding governance. Dev auto-activates new tools; production requires a
# Risk-Board approval before a newly-discovered tool is callable.
registry:
  require_approval: false              # set true in production (Risk-Board gate)

servers:
  # Reference test fixtures (deleted after pilot; production servers onboard via registry)
  - name: docs
    command: python
    args: ["servers/docs_server.py"]
  - name: actions
    command: python
    args: ["servers/actions_server.py"]
