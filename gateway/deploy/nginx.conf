# mTLS-terminating reverse proxy for the MCP Gateway (Tier-1 transport security).
#
# What this closes:
#   * TLS 1.3 on the wire — the gateway's bearer token + session binding no longer
#     travel in cleartext (in-transit theft/replay).
#   * Mutual TLS — the client must present a certificate signed by our CA. nginx
#     verifies it and injects the TLS-verified SHA-256 thumbprint; any
#     client-supplied X-Client-Cert-Thumbprint is STRIPPED and replaced, so a
#     client can never assert a thumbprint it didn't prove at the TLS layer.
#   * Direct-access bypass — nginx adds the shared-secret X-Proxy-Auth header the
#     gateway's trusted_proxy guard requires, so reaching the app on 8800 directly
#     (skipping mTLS) is refused.
#
# The gateway listens only on loopback / the internal network; only nginx is exposed.

events {}

http {
    # The gateway app upstream (internal network only — never published).
    upstream mcp_gateway { server gateway:8800; }

    # Client-cert -> lowercase hex SHA-256 thumbprint (matches pki.cert_thumbprint()).
    map $ssl_client_fingerprint $verified_thumbprint { default $ssl_client_fingerprint; }

    server {
        listen 8443 ssl;
        http2 on;
        server_name gateway.internal;

        # --- server TLS ---
        ssl_certificate     /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;
        ssl_protocols TLSv1.3;
        ssl_prefer_server_ciphers on;

        # --- mutual TLS: require a client cert signed by our CA ---
        ssl_client_certificate /etc/nginx/tls/ca.crt;
        ssl_verify_client on;
        ssl_verify_depth 2;

        # Reject anything that failed client-cert verification.
        if ($ssl_client_verify != SUCCESS) { return 496; }

        # Strip anything the client tried to spoof, then inject verified values.
        proxy_set_header X-Client-Cert-Thumbprint $verified_thumbprint;
        proxy_set_header X-Proxy-Auth $MCP_PROXY_SHARED_SECRET;   # templated at deploy
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;

        location / {
            proxy_pass http://mcp_gateway;
            proxy_http_version 1.1;
        }
    }

    # Plain-HTTP listener only redirects to HTTPS (no app traffic in cleartext).
    server {
        listen 8080;
        return 308 https://$host:8443$request_uri;
    }
}
