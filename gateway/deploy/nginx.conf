# mTLS-terminating reverse proxy for the MCP Gateway (Phase-0 transport security).
#
# Layered authentication:
#   * TLS 1.3 on the wire.
#   * Mutual TLS - the client must present a cert signed by our CA (authenticates
#     the device/workstation). nginx aborts the handshake without a valid cert.
#   * Password + TOTP MFA at the gateway (authenticates the person).
#   * X-Proxy-Auth shared secret - proves the request came through this proxy, so
#     reaching the gateway directly (bypassing mTLS) is refused by its guard.
#
# The gateway binds each session to a server-issued secret the client replays in
# X-Client-Cert-Thumbprint; that header passes through unchanged (bearer-binding).

events {}

http {
    upstream mcp_gateway { server gateway:8800; }

    server {
        listen 8443 ssl;
        server_name gateway.internal localhost;

        ssl_certificate     /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        ssl_client_certificate /etc/nginx/tls/ca.crt;
        ssl_verify_client on;
        ssl_verify_depth 2;

        location / {
            proxy_set_header X-Proxy-Auth "${MCP_PROXY_SHARED_SECRET}";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            # Authorization and X-Client-Cert-Thumbprint (session binding) pass
            # through unchanged - required for bearer-binding.
            proxy_pass http://mcp_gateway;
            proxy_http_version 1.1;
        }
    }

    # Plain HTTP only redirects to HTTPS - no app traffic in the clear.
    server {
        listen 8080;
        server_name _;
        return 308 https://$host:8443$request_uri;
    }
}
