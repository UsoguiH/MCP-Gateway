# mTLS-terminating load balancer for the HA gateway pair (Phase 3).
#
# Same layered authentication as deploy/nginx.conf (TLS 1.3 + mutual TLS +
# X-Proxy-Auth shared secret), now in front of TWO gateway instances:
#
#   * round-robin across gateway-a / gateway-b — no sticky sessions needed,
#     because Phase 3 moved sessions/rate/breaker/taint into the shared gwstate
#     database: any instance can serve any request of any session.
#   * passive health ejection: max_fails/fail_timeout takes a dead instance out
#     of rotation within seconds; it rejoins automatically when it answers again.
#   * a connect-refused node (killed container) fails over transparently: nginx
#     only re-dispatches a request that was never sent to the dead upstream, so
#     a tool call can never be silently executed twice.

events {}

http {
    upstream mcp_gateway {
        server gateway-a:8800 max_fails=3 fail_timeout=10s;
        server gateway-b:8800 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 8443 ssl;
        server_name gateway.internal localhost;

        ssl_certificate     /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        ssl_client_certificate /etc/nginx/tls/ca.crt;
        ssl_verify_client on;
        ssl_verify_depth 2;

        location / {
            proxy_set_header X-Proxy-Auth "${MCP_PROXY_SHARED_SECRET}";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            # Authorization and X-Client-Cert-Thumbprint (session binding) pass
            # through unchanged - required for bearer-binding.
            proxy_pass http://mcp_gateway;
            proxy_http_version 1.1;
            # Fail over on connect errors only (a request that already reached an
            # instance is NOT replayed — tool calls must never double-execute).
            proxy_next_upstream error timeout;
            proxy_connect_timeout 3s;
        }
    }

    # Plain HTTP only redirects to HTTPS - no app traffic in the clear.
    server {
        listen 8080;
        server_name _;
        return 308 https://$host:8443$request_uri;
    }
}
